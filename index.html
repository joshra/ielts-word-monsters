<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* 版面：頂部日期列；桌面左欄是今日十詞、右欄是單字訓練台；手機改為上下堆疊。 */
:root {
  --bg: #f7f8f3; --surface: #ffffff; --sunken: #eef2ec;
  --ink: #1e332f; --muted: #5d706b; --line: #dbe2dc;
  --brand: #175952; --brand-ink: #ffffff; --brand-soft: #e2efe9;
  --good: #1f7a4d; --good-soft: #e0f1e6; --warn: #8a5a00; --warn-soft: #f8edcf; --bad: #a3322b; --bad-soft: #f8e2df;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a18; --surface: #182623; --sunken: #13201d;
    --ink: #e3ece8; --muted: #9db0aa; --line: #2c3f3a;
    --brand: #7fd0c0; --brand-ink: #0c1f1b; --brand-soft: #1f3833;
    --good: #7fd6a5; --good-soft: #1b3527; --warn: #e9c46a; --warn-soft: #3a3016; --bad: #f0958c; --bad-soft: #40211e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a18; --surface: #182623; --sunken: #13201d;
  --ink: #e3ece8; --muted: #9db0aa; --line: #2c3f3a;
  --brand: #7fd0c0; --brand-ink: #0c1f1b; --brand-soft: #1f3833;
  --good: #7fd6a5; --good-soft: #1b3527; --warn: #e9c46a; --warn-soft: #3a3016; --bad: #f0958c; --bad-soft: #40211e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 1.25rem; letter-spacing: .02em; }
.brand h1 span { font-family: var(--serif); font-style: italic; color: var(--brand); margin-left: 4px; }
.brand small { color: var(--muted); font-size: .85rem; }
.datebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.datebar input[type="date"] { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 40px; font-variant-numeric: tabular-nums; }
.status { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.status.is-error .dot { background: var(--bad); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--brand); padding-inline: 8px; text-decoration: underline; text-underline-offset: 3px; }
.btn.small { min-height: 32px; padding: 3px 10px; font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.layout { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }

.menuhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.menuhead h2 { font-size: 1.05rem; }
.menuhead .tally { font-variant-numeric: tabular-nums; color: var(--brand); font-weight: 600; }
.level { font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
@media (max-width: 860px) { .menu { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }
.mi { display: flex; align-items: stretch; gap: 4px; min-width: 0; }
.mi > .pick { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: var(--sunken); border-radius: 10px; padding: 7px 10px; min-height: 42px; }
.mi > .pick .no { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mi > .pick .mw { font-family: var(--serif); font-size: 1.05rem; overflow-wrap: anywhere; }
.mi > .pick .mc { font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.mi.sel > .pick { border-color: var(--brand); background: var(--brand-soft); }
.mi.full > .pick .mc { color: var(--good); font-weight: 700; }
.mi > .swap { border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 0 8px; font-size: .78rem; color: var(--muted); }
.mi > .swap:hover { color: var(--brand); border-color: var(--brand); }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: flex-end; }
.head .slot { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hw { font-family: var(--serif); font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.15; font-weight: 600; overflow-wrap: anywhere; }
.hw.masked { font-family: var(--sans); font-size: 1.15rem; color: var(--muted); font-weight: 500; padding-block: 10px; }
.phon { color: var(--muted); font-size: .95rem; }
.gloss { color: var(--ink); }
.gloss b { color: var(--brand); font-weight: 600; margin-right: 6px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 14px; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .9rem; min-height: 36px; }
.tab[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.tab.done:not([aria-selected="true"]) { background: var(--good-soft); border-color: transparent; color: var(--good); }

.body { display: flex; flex-direction: column; gap: 12px; }
.lead { color: var(--muted); font-size: .92rem; }
.sent { font-family: var(--serif); font-size: 1.3rem; line-height: 1.5; overflow-wrap: anywhere; }
.sent.zh { font-family: var(--sans); font-size: 1.15rem; }
.tr { color: var(--muted); }
.note { background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.note h3 { font-size: .8rem; color: var(--muted); letter-spacing: .06em; font-weight: 600; margin-bottom: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.chips li { background: var(--brand-soft); border-radius: 999px; padding: 2px 10px; font-size: .9rem; }
.chips.en li { font-family: var(--serif); font-size: 1rem; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: var(--muted); }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 1rem; }
textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
.ref { border-left: 3px solid var(--brand); padding: 6px 12px; background: var(--brand-soft); border-radius: 0 10px 10px 0; }
.ref h3 { font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.diff span { padding: 0 2px; border-radius: 4px; }
.diff .miss { background: var(--bad-soft); color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
.msg.ok { background: var(--good-soft); color: var(--good); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.doneline { color: var(--good); font-weight: 600; }

.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { width: 44px; height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-family: var(--serif); font-size: 1.4rem; text-transform: lowercase; }
.tile.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.pickline { font-family: var(--serif); font-size: 1.3rem; letter-spacing: .12em; min-height: 1.6em; }
.pickline em { color: var(--muted); font-family: var(--sans); font-size: .9rem; font-style: normal; letter-spacing: 0; }

.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; }
.kv dt { color: var(--muted); font-size: .9rem; }
.kv dd { margin: 0; font-family: var(--serif); font-size: 1.05rem; overflow-wrap: anywhere; }
.kv dd.zh { font-family: var(--sans); font-size: 1rem; }
.sense { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.sense:first-of-type { border-top: 0; padding-top: 0; }
.none { color: var(--muted); font-size: .9rem; font-family: var(--sans); }

.foot { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.banner { background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-top: 12px; }

details.course > summary { cursor: pointer; font-weight: 600; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 12px; }
.group { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.group.now { border-color: var(--brand); background: var(--brand-soft); }
.group h3 { font-size: .9rem; font-variant-numeric: tabular-nums; }
.group p { font-family: var(--serif); overflow-wrap: anywhere; line-height: 1.5; }

.stack { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }
h2.sec { font-size: 1.05rem; margin-bottom: 4px; }
.hints ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: h; }
.hints ol > li { counter-increment: h; display: grid; gap: 4px; min-width: 0; }
.hints ol > li > h3::before { content: counter(h) ". "; }
.hints .sent { font-size: 1.15rem; }
.hints .chips .tr { font-family: var(--sans); font-size: .85rem; }
.chips li.used { background: var(--good-soft); color: var(--good); font-weight: 600; }
.errs { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.errs li { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; min-width: 0; }
.errs .tr { overflow-wrap: anywhere; }
.errhead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.errhead b { font-family: var(--serif); font-size: 1.1rem; }
.errhead span { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; background: var(--sunken); border-radius: 12px; padding: 4px; }
.navb { border: 0; background: transparent; border-radius: 9px; padding: 6px 14px; min-height: 36px; color: var(--muted); }
.navb[aria-current="page"] { background: var(--surface); color: var(--brand); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-block: 8px 10px; }
select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; min-height: 42px; font: inherit; color: var(--ink); }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline input { width: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 40px; }
.field.inline input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; padding: 0; border: 0; accent-color: var(--brand); }
.count { font-weight: 600; margin-block: 10px 6px; font-variant-numeric: tabular-nums; }
.rows, .recs { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px 10px; align-items: center; border-top: 1px solid var(--line); padding: 6px 0; }
.rows input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--brand); }
.rowmain { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr); gap: 2px 12px; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 8px; min-width: 0; min-height: 40px; align-items: baseline; }
.rowmain:hover { background: var(--sunken); }
.rw { font-family: var(--serif); font-size: 1.1rem; overflow-wrap: anywhere; }
.rz { color: var(--muted); font-size: .92rem; min-width: 0; }
.rz b { color: var(--brand); font-weight: 600; }
.rmeta { color: var(--muted); font-size: .8rem; }
.badge { font-size: .78rem; border-radius: 999px; padding: 2px 10px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.badge.done { background: var(--good-soft); color: var(--good); }
.badge.weak { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 620px) { .rows li { grid-template-columns: auto minmax(0, 1fr) auto; } .rmeta { display: none; } .rowmain { grid-template-columns: minmax(0, 1fr); } }
.pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 14px; font-variant-numeric: tabular-nums; }
.chips .x { border: 0; background: transparent; color: var(--muted); padding: 0 2px; font-size: 1rem; line-height: 1; }
.recs li { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; min-width: 0; }
.recs li:first-child { border-top: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; z-index: 20; font-size: .95rem; }
.center { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .tile { transition: background-color .12s, border-color .12s; } }

/* 怪獸：顏色由分類（屬性）決定，部件由 core/monster.js 產生 */
.mon { display: block; flex: none; --m-ink: #102b24; --m-wt: #ffffff; --m1: #9aa39f; --m2: #6e7773; --egg: #e8e1c8; --egg-ln: #b8ad88; }
.mon .b1 { fill: var(--m1); } .mon .b2 { fill: var(--m2); } .mon .wt { fill: var(--m-wt); } .mon .ey { fill: var(--m-ink); }
.mon .ln { fill: none; stroke: var(--m-ink); stroke-width: 2.5; stroke-linecap: round; }
.mon .ch { fill: var(--m2); opacity: .55; } .mon .wg { fill: var(--m1); opacity: .55; }
.mon .au { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 4 5; }
.mon .eg { fill: var(--egg); stroke: var(--egg-ln); stroke-width: 1.5; } .mon .ck { fill: none; stroke: var(--egg-ln); stroke-width: 2; stroke-linecap: round; }
.mon.wild { --m1: #a6ada9; --m2: #7a827e; }
.mon.sil { opacity: .45; } .mon.sil .b1, .mon.sil .b2, .mon.sil .wt, .mon.sil .ey, .mon.sil .ch, .mon.sil .wg { fill: var(--muted); } .mon.sil .ln, .mon.sil .au { stroke: var(--muted); } .mon.sil .ln { fill: none; }
/* 12 個雅思主題屬性：主色畫身體，深色畫角、腳、花紋；深色模式各提亮一階 */
.el-env { --m1: #3fae7b; --m2: #1c6f58; } .el-sci { --m1: #4f9fd9; --m2: #245f91; } .el-health { --m1: #e2694f; --m2: #9c3a26; } .el-edu { --m1: #f0a35c; --m2: #b35f1e; } .el-work { --m1: #e2b93b; --m2: #a3781a; } .el-soc { --m1: #8aa0ad; --m2: #4f6472; } .el-cul { --m1: #9a7fd6; --m2: #5c4596; } .el-city { --m1: #b58a5a; --m2: #7a5733; } .el-ppl { --m1: #e67fa3; --m2: #a4405f; } .el-data { --m1: #5fc3b5; --m2: #2a7f74; } .el-acad { --m1: #b19fc9; --m2: #6f5f88; } .el-daily { --m1: #a9b94a; --m2: #6b7a22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .el-env { --m1: #4fc08c; --m2: #2a8a6b; } :root:not([data-theme="light"]) .el-sci { --m1: #5fb0ea; --m2: #2f74ad; } :root:not([data-theme="light"]) .el-health { --m1: #ef7d64; --m2: #b3482f; } :root:not([data-theme="light"]) .el-edu { --m1: #f5b16e; --m2: #c46a24; } :root:not([data-theme="light"]) .el-work { --m1: #ecc650; --m2: #b58a22; } :root:not([data-theme="light"]) .el-soc { --m1: #9bb1be; --m2: #5d7382; } :root:not([data-theme="light"]) .el-cul { --m1: #a98fe3; --m2: #6b52aa; } :root:not([data-theme="light"]) .el-city { --m1: #c49a6a; --m2: #8a653e; } :root:not([data-theme="light"]) .el-ppl { --m1: #ef90b2; --m2: #b84d6e; } :root:not([data-theme="light"]) .el-data { --m1: #6fd2c4; --m2: #348f83; } :root:not([data-theme="light"]) .el-acad { --m1: #bfaed6; --m2: #7e6d99; } :root:not([data-theme="light"]) .el-daily { --m1: #b8c85a; --m2: #788a2a; } }
:root[data-theme="dark"] .el-env { --m1: #4fc08c; --m2: #2a8a6b; } :root[data-theme="dark"] .el-sci { --m1: #5fb0ea; --m2: #2f74ad; } :root[data-theme="dark"] .el-health { --m1: #ef7d64; --m2: #b3482f; } :root[data-theme="dark"] .el-edu { --m1: #f5b16e; --m2: #c46a24; } :root[data-theme="dark"] .el-work { --m1: #ecc650; --m2: #b58a22; } :root[data-theme="dark"] .el-soc { --m1: #9bb1be; --m2: #5d7382; } :root[data-theme="dark"] .el-cul { --m1: #a98fe3; --m2: #6b52aa; } :root[data-theme="dark"] .el-city { --m1: #c49a6a; --m2: #8a653e; } :root[data-theme="dark"] .el-ppl { --m1: #ef90b2; --m2: #b84d6e; } :root[data-theme="dark"] .el-data { --m1: #6fd2c4; --m2: #348f83; } :root[data-theme="dark"] .el-acad { --m1: #bfaed6; --m2: #7e6d99; } :root[data-theme="dark"] .el-daily { --m1: #b8c85a; --m2: #788a2a; }
.mon .ln2 { fill: none; stroke: var(--m2); stroke-width: 3; stroke-linecap: round; } .mon .sp { fill: var(--warn); }
.ttag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px 1px 6px; font-size: .78rem; background: color-mix(in srgb, var(--m1) 22%, var(--surface)); color: var(--m2); vertical-align: middle; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ttag { color: var(--m1); } }
:root[data-theme="dark"] .ttag { color: var(--m1); }
.ttag .ico { flex: none; }
/* 難度：三根長條，亮的根數代表等級；三級各用一個既有的語意色，深淺模式都跟著主題變 */
